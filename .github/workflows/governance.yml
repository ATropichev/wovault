name: AgentMarshal governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: agentmarshal-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the released gate outside candidate code
        run: |
          python -m venv "$RUNNER_TEMP/agentmarshal-gate"
          "$RUNNER_TEMP/agentmarshal-gate/bin/python" -m pip install agentmarshal==0.6.0
      - name: Check contract, scope and journal integrity
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AGENTMARSHAL_ACTOR: ci-governance
        run: |
          task="$(python - <<'PY'
          import os, re
          tasks = re.findall(r'(?<![A-Za-z0-9])CR-[0-9]+(?![A-Za-z0-9])', os.environ['HEAD_REF'])
          if len(tasks) != 1:
              raise SystemExit('The PR branch must contain exactly one CR identifier')
          print(tasks[0])
          PY
          )"
          "$RUNNER_TEMP/agentmarshal-gate/bin/agentmarshal" gate \
            --attestation ci-required --without-review \
            --task "$task" --commit "$HEAD_SHA" --base "$BASE_SHA"
      # Review is enforced separately by the required agentmarshal-review status.
      # This job must never publish that status or claim a full reviewed gate pass.

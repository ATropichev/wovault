name: specifications
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTMARSHAL_ACTOR: ci-specifications
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements.txt
          npm ci --prefix tools/openspec --ignore-scripts --no-audit --no-fund
      - name: Validate journal and specifications
        run: |
          scripts/agentmarshal validate
          scripts/check
